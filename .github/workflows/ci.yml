name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Prepare wheels for offline installation tests
        run: |
          wheelhouse="$RUNNER_TEMP/kvscope-install-wheels"
          python tools/prepare_calibration_install_wheels.py --wheelhouse "$wheelhouse"
          echo "KVSCOPE_TEST_WHEELHOUSE=$wheelhouse" >> "$GITHUB_ENV"

      - name: Ruff check
        run: ruff check .

      - name: Mypy
        run: mypy src/kvscope

      - name: Pytest
        run: pytest --cov=kvscope --cov-report=term-missing
